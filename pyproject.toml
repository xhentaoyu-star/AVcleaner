[project]
name = "avcleaner"
version = "0.7.2"
description = "Local GUI tool for safe AV filename cleanup and junk-file quarantine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "pywebview>=5.0,<7.0",
  "keyring>=25.0,<26.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
